plugins {
    id 'com.android.application'
    // Firebase google-services plugin removed — Supabase uses REST API, no plugin needed
}

android {
    namespace 'com.sahayakai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sahayakai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Inject Gemini API key from gradle.properties into BuildConfig
        buildConfigField "String", "GEMINI_API_KEY", "\"${GEMINI_API_KEY}\""

        // Inject Supabase credentials from gradle.properties into BuildConfig
        // These are the PUBLIC (anon) credentials — safe to include in the app.
        // NEVER put the service_role key here.
        buildConfigField "String", "SUPABASE_URL", "\"${SUPABASE_URL}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${SUPABASE_ANON_KEY}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // UI Components
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.12.0'

    // HTTP client — used for BOTH Gemini API and Supabase REST API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing
    implementation 'org.json:json:20231013'

    // NOTE: No Firebase dependencies. No Supabase Android SDK needed.
    // Supabase is accessed via its REST API using OkHttp above.
}

